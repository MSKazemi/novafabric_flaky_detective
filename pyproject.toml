[project]
name = "flaky-detective"
version = "0.1.0"
description = "Agentic test-flakiness vs regression triage for the UiPath platform, powered by NovaFabric."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    # NovaFabric is the capture/replay/diff engine — now public on PyPI.
    "novafabric>=0.58",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flaky_detective"]
